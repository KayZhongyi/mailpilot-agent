[project]
name = "mailpilot-agent"
version = "0.1.0"
description = "Crash-safe mail merge for AI agents and CLI workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "MailPilot Agent contributors" }]
dependencies = [
  "certifi",
  "jinja2",
  "openpyxl",
  "pandas",
  "pyyaml",
]

[project.scripts]
mailpilot = "mailpilot.mailer:main"
mailpilot-agent = "mailpilot.mailer:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
packages = ["mailpilot"]
include-package-data = true

[tool.setuptools.package-data]
mailpilot = ["templates/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
