# Copy this file to config.yaml and fill in your real values.
# NEVER commit config.yaml — it holds a credential. (.gitignore already excludes it.)
#
# IMPORTANT: smtp.password must be an APP PASSWORD / authorization code,
# NOT your normal login password. See references/email_provider_setup.md.

smtp:
  # --- Pick your provider. Defaults below are for Gmail; see the commented alternatives. ---
  host: smtp.gmail.com
  port: 465
  use_ssl: true
  user: you@example.com
  password: YOUR_APP_PASSWORD_HERE      # app password / authorization code — NOT your login password
  # Rotate proactively before providers enforce a lower per-connection message cap.
  max_messages_per_connection: 50

  # Outlook / Microsoft 365:
  #   host: smtp.office365.com
  #   port: 587
  #   use_ssl: false                    # Outlook uses STARTTLS on 587
  # NetEase enterprise (@qiye.163.com):
  #   host: smtphz.qiye.163.com
  #   port: 465
  #   use_ssl: true

# Sender identity shown to recipients
from_addr: you@example.com
from_name: Your Name

# Unsubscribe contact for a basic List-Unsubscribe header. This is NOT an RFC 8058
# one-click endpoint and does not itself satisfy bulk-marketing compliance. Email or
# https URL; defaults to from_addr if omitted.
unsubscribe: you@example.com

# IMAP — only needed for the `bounces` command, which reads bounce notifications in your inbox.
# It may use a different app password, but the local web workflow requires the IMAP login
# identity to equal the production SMTP user or from_addr. MailPilot v0.2 scans INBOX only;
# it does NOT support IMAP OAuth or provider webhook/event APIs. Exchange Online password
# IMAP is therefore unsupported in v0.2.
# imap:
#   host: imap.gmail.com
#   port: 993
#   user: you@example.com
#   password: YOUR_IMAP_APP_PASSWORD_HERE
